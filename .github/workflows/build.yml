name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build (Java 11 / Java 8 bytecode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 仓库不含 gradle wrapper（本项目不在开发机运行 Gradle），由 action 下载指定版本并加入 PATH
          gradle-version: '7.6.4'

      # BedWars1058 是付费闭源插件，公开仓库不能提交其 jar。
      # 如果配置了仓库 secret BEDWARS1058_JAR_BASE64，则用真实 jar 编译（推荐，签名最准确）；
      # 否则 build.gradle 会自动回退到 src/bedwarsStub 的最小 API 存根。
      - name: Prepare BedWars1058 API jar (optional)
        env:
          BEDWARS1058_JAR_BASE64: ${{ secrets.BEDWARS1058_JAR_BASE64 }}
        run: |
          mkdir -p libs
          if [ -n "${BEDWARS1058_JAR_BASE64}" ]; then
            echo "${BEDWARS1058_JAR_BASE64}" | base64 -d > libs/Bedwars-plugin-23.1.1.jar
            echo "已从 secret 还原真实 BedWars1058 jar：$(ls -l libs/Bedwars-plugin-23.1.1.jar)"
          else
            echo "未配置 BEDWARS1058_JAR_BASE64，使用 src/bedwarsStub 的 API 存根编译。"
          fi

      - name: Gradle build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: XBedSync-jar
          path: build/libs/XBedSync-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
