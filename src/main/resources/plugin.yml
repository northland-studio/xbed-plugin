name: XBedSync
version: 1.0.1
main: cn.xuanjian.xbedsync.XBedSync
# 目标运行环境为 PaperSpigot 1.8.8，该版本不识别 api-version 字段，故不填写。
author: XuanJian
description: XBed 赛事数据采集插件（BedWars1058 / PaperSpigot 1.8.8）
load: POSTWORLD
depend:
  - BedWars1058
commands:
  xbedsync:
    description: XBedSync 状态与重发命令
    usage: /xbedsync <status|retry|ping>
    permission: xbedsync.admin
    permission-message: 你没有权限使用该命令。
permissions:
  xbedsync.admin:
    description: XBedSync 管理命令权限
    default: op
