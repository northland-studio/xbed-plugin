/*
 * XBedSync 鈥斺€?XBed 璧涗簨骞冲彴鏈嶅姟鍣ㄦ暟鎹噰闆嗘彃浠讹紙BedWars1058 / PaperSpigot 1.8.8锛?
 *
 * 鏋勫缓璇存槑锛?
 *   - 浣跨敤 Spigot 1.8.8 API 浣滀负 compileOnly 渚濊禆锛圥aperSpigot 1.8.8 涓?Spigot 1.8.8 API 浜岃繘鍒朵竴鑷达紝
 *     Paper 瀹樻柟 Maven 浠撳簱骞朵笉鍙戝竷 1.8.8 鐨?paper-api锛屽洜姝ゅ繀椤讳娇鐢?org.spigotmc:spigot-api:1.8.8锛夈€?
 *   - BedWars1058 涓轰粯璐归棴婧愭彃浠讹紝娌℃湁鍏紑 Maven 浠撳簱锛?
 *       1) 鑻ュ瓨鍦?libs/Bedwars-plugin-23.1.1.jar锛屽垯鐩存帴鐢ㄧ湡瀹?jar 缂栬瘧锛堟帹鑽愶紝鏈€鍑嗙‘锛夛紱
 *       2) 鑻ヤ笉瀛樺湪锛堜緥濡傚叕寮€ GitHub 浠撳簱鐨?CI锛夛紝鑷姩鍥為€€鍒?src/bedwarsStub/java 鐨勬渶灏?API 瀛樻牴缂栬瘧銆?
 *     瀛樻牴鍙弬涓庣紪璇戙€佷笉浼氭墦杩涙渶缁?jar锛涜繍琛屾湡濮嬬粓浣跨敤鐪熷疄 BedWars1058 鎻掍欢銆?
 *   - 鐩爣瀛楄妭鐮?Java 8锛屽彲杩愯鍦?Java 11 鐨?PaperSpigot 1.8.8 鏈嶅姟绔笂銆?
 */
plugins {
    id 'java'
}

group = 'cn.xuanjian'
version = '1.0.1'
description = 'XBed tournament match data collector/reporter for BedWars1058'

def bedwarsJar = file('libs/Bedwars-plugin-23.1.1.jar')
def useRealBedWarsJar = bedwarsJar.exists()

repositories {
    // Spigot 1.8.8 API锛坰napshot 浠撳簱锛?
    maven { url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/') }
    // PaperMC 浠撳簱锛堝鐢紝渚夸簬浠ュ悗鍒囨崲 paper-api锛?
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
    mavenCentral()
}

configurations {
    // 浠呬緵 bedwarsStub source set 缂栬瘧浣跨敤鐨?classpath
    bedwarsStubCompile
}

sourceSets {
    // 鏈€灏?BedWars1058 API 瀛樻牴锛堜粎鍦ㄧ己灏戠湡瀹?jar 鏃剁敤浜庣紪璇戯級
    bedwarsStub {
        java {
            srcDirs = ['src/bedwarsStub/java']
        }
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'

    bedwarsStubCompile 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

sourceSets.bedwarsStub.compileClasspath = configurations.bedwarsStubCompile

if (useRealBedWarsJar) {
    dependencies {
        compileOnly files(bedwarsJar)
    }
    logger.lifecycle("[XBedSync] 缂栬瘧渚濊禆锛氱湡瀹?BedWars1058 jar -> ${bedwarsJar}")
} else {
    dependencies {
        compileOnly sourceSets.bedwarsStub.output
    }
    compileJava.dependsOn 'compileBedwarsStubJava'
    logger.lifecycle('[XBedSync] 鏈壘鍒?libs/Bedwars-plugin-23.1.1.jar锛屼娇鐢?src/bedwarsStub 涓嬬殑 API 瀛樻牴缂栬瘧銆?)
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 涓嶄娇鐢?-Werror锛氫笉鍚?JDK 鐨勫憡璀﹀樊寮備笉搴旈樆濉炴瀯寤?
    options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('jar') {
    archiveBaseName = 'XBedSync'
    manifest {
        attributes(
                'Implementation-Title': 'XBedSync',
                'Implementation-Version': project.version,
                'Built-With-Java': System.getProperty('java.version')
        )
    }
}

// 鏋勫缓瀹屾垚鍚庢墦鍗颁骇鐗╄矾寰勶紝鏂逛究 CI 鏃ュ織鎺掓煡
tasks.register('printJarPath') {
    doLast {
        tasks.jar.archiveFile.get().asFile.with { f ->
            println "[XBedSync] jar: ${f.absolutePath}"
        }
    }
}
build.dependsOn 'printJarPath'

